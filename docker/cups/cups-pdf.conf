# Minimal override on top of cups-pdf's built-in defaults (see
# /usr/share/doc/printer-driver-cups-pdf/cups-pdf.conf.example) -- every
# directive not set here keeps that default. Only what this test container
# actually needs: every finished PDF, regardless of which local user the
# print job resolved to, lands in one fixed, world-writable directory that
# docker-compose.test.yml bind-mounts out to the host and into the
# pi-server container, so tests/docker/test_cups_integration.py can find
# it without a docker exec into this container.
Out /output
AnonDirName /output
AnonUMask 0000
UserUMask 0000
Label 0
