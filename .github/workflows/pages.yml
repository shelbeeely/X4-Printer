# Build and deploy the GitHub Pages site (site/), optionally bundling a
# flashable firmware build for site/flash.html's ESP Web Tools integration.
#
# Why `build-firmware` runs with `continue-on-error: true`:
#   The firmware build depends on things this workflow cannot guarantee:
#   cloning the external https://github.com/Free-Ink/freeink-sdk repo (not
#   vendored here, see docs/setup-x4.md step 1) and downloading the pinned
#   ESP32 PlatformIO platform, both over the network on GitHub-hosted
#   runners. If either is flaky/unavailable, or the firmware source itself
#   temporarily fails to build, that must NEVER take the Pages site down —
#   the docs/how-it-works/setup pages have no dependency on firmware
#   compiling. So the firmware job is allowed to fail without failing the
#   workflow, and the site job runs unconditionally after it (`needs:
#   build-firmware` + `if: always()`) and simply skips generating a flash
#   manifest when there's nothing to flash.
#
# One-time manual setup required (this workflow cannot do this itself):
#   In the repo's Settings -> Pages, set "Source" to "GitHub Actions". Until
#   that's done, the `deploy` job's actions/deploy-pages step will fail even
#   though the build succeeds.
#
# Manifest contract (shared with site/flash.html, which
# `fetch('firmware/manifest.json')`s this at runtime):
#   _site/firmware/manifest.json is only ever written when build-firmware
#   succeeded AND produced all three binaries. Its shape is the ESP Web
#   Tools manifest format:
#     {
#       "name": "X4 Print Inbox",
#       "version": "<git short sha>",
#       "builds": [
#         {
#           "chipFamily": "ESP32-C3",
#           "parts": [
#             {"path": "bootloader.bin", "offset": 0},
#             {"path": "partitions.bin", "offset": 32768},
#             {"path": "firmware.bin", "offset": 65536}
#           ]
#         }
#       ]
#     }
#   When the firmware build failed/was skipped, no manifest.json is written
#   at all -- a 404 on that fetch is the expected degraded state, and
#   site/flash.html is designed to show a "not built yet, build locally"
#   fallback in that case rather than treating it as an error. If you
#   change what files the firmware build produces, or their flash offsets,
#   update both this workflow and site/flash.html together.
#
# Binary filename assumption: PlatformIO's Arduino-ESP32 build for
# esp32-c3-devkitm-1 normally emits bootloader.bin, partitions.bin, and
# firmware.bin under firmware/.pio/build/xteink_x4_release/. This has not
# been verified against an actual CI run of this repo's build (sandboxed
# dev environment has no network access to freeink-sdk or the PlatformIO
# platform download) -- if the real output differs, update the `find`/copy
# step below and the manifest `parts` paths above together.

name: Deploy Pages

on:
  push:
    # NOTE: this repo has no `main` yet -- the feature branch below IS the
    # default branch for now. Update this to `main` once/if this repo
    # adopts one.
    branches: [claude/xteink-print-inbox-system-6lh4v6]
  workflow_dispatch:

concurrency:
  group: "pages"
  # Pages deploys shouldn't be cancelled mid-flight; let an in-progress
  # deploy finish and simply queue the next one.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-firmware:
    name: Build firmware (best-effort)
    runs-on: ubuntu-latest
    # Never let a firmware build failure fail the workflow / block the
    # site deploy -- see top-of-file comment.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone freeink-sdk
        # Exact path firmware/platformio.ini's `symlink://freeink-sdk/...`
        # lib_deps expect, relative to firmware/.
        run: git clone https://github.com/Free-Ink/freeink-sdk firmware/freeink-sdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (release env)
        id: build
        working-directory: firmware
        run: pio run -e xteink_x4_release

      - name: Stage firmware binaries
        if: steps.build.outcome == 'success'
        id: stage
        working-directory: firmware
        run: |
          set -e
          out=".pio/build/xteink_x4_release"
          mkdir -p /tmp/firmware-out
          missing=0
          for f in bootloader.bin partitions.bin firmware.bin; do
            if [ -f "$out/$f" ]; then
              cp "$out/$f" "/tmp/firmware-out/$f"
            else
              echo "::warning::Expected build output $out/$f not found"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload firmware artifact
        # Guard on both the build step and the staging step actually
        # succeeding with all three binaries present -- continue-on-error
        # on the job means later steps still run even after a failure, so
        # this must not assume the build worked.
        if: steps.build.outcome == 'success' && steps.stage.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bins
          path: /tmp/firmware-out/*.bin
          if-no-files-found: error
          retention-days: 14

  build-site:
    name: Build Pages site
    needs: build-firmware
    # Run regardless of whether build-firmware succeeded, failed, or was
    # skipped -- the site must deploy either way.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r site/* _site/

      - name: Download firmware artifact (best-effort)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: _site/firmware

      - name: Generate flash manifest (only if all binaries are present)
        run: |
          set -e
          dir="_site/firmware"
          if [ -f "$dir/bootloader.bin" ] && [ -f "$dir/partitions.bin" ] && [ -f "$dir/firmware.bin" ]; then
            version="$(git rev-parse --short HEAD)"
            cat > "$dir/manifest.json" <<EOF
          {
            "name": "X4 Print Inbox",
            "version": "$version",
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [
                  {"path": "bootloader.bin", "offset": 0},
                  {"path": "partitions.bin", "offset": 32768},
                  {"path": "firmware.bin", "offset": 65536}
                ]
              }
            ]
          }
          EOF
            echo "Generated $dir/manifest.json for version $version"
          else
            echo "Firmware binaries not present -- skipping manifest.json (site/flash.html falls back to its 'not built yet' state)"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
