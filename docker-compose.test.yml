# Local dev/testing stack -- NOT the deployment story (see docs/setup-pi.md:
# a real install is a bare Raspberry Pi under systemd). This exists for two
# things: running pi-server/relay in a consistent container instead of a
# host venv, and -- the part that actually adds new coverage -- letting
# printer_forward.py's `lp` shell-out hit a real CUPS daemon (docker/cups/)
# instead of the fake `lp` every other test in this repo uses. See
# docs/testing.md.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build cups
#   docker compose -f docker-compose.test.yml run --rm pi-server \
#     python -m pytest tests_docker -q
#   docker compose -f docker-compose.test.yml down -v

services:
  cups:
    build:
      context: .
      dockerfile: docker/cups/Dockerfile
    volumes:
      - cups-output:/output
    healthcheck:
      # CMD-SHELL (not CMD): needs `&&`, which the exec form can't run.
      # See docker/cups/Dockerfile's matching HEALTHCHECK comment for why
      # the /tmp/cups-ready marker matters, not just the lpstat query.
      test: ["CMD-SHELL", "test -f /tmp/cups-ready && lpstat -h localhost:631 -p PDF"]
      interval: 2s
      timeout: 5s
      retries: 30

  pi-server:
    build:
      context: .
      dockerfile: docker/pi-server.Dockerfile
    environment:
      # KNOWN BROKEN as of this writing -- see docs/testing.md's
      # "Docker: real-CUPS integration" section before touching this again.
      # Cross-container lpstat/lp against $CUPS_SERVER fails with
      # "Error - add '/version=1.1' to server name." regardless of whether
      # that suffix is actually present in the value (tested both ways with
      # identical results), which rules out real IPP-version-negotiation as
      # the cause -- it's CUPS's generic fallback message for something
      # else. cupsd itself, cupsctl, and lpadmin all work correctly (see
      # docker/cups/entrypoint.sh's own -h localhost:631 calls, and its
      # printer-is-shared=true), so this is specifically about the
      # CROSS-CONTAINER connection, not the daemon's own config. Needs a
      # human with real `docker compose` access (packet capture or
      # `cupsd -f` verbose logging) to get further -- CI's log-only feedback
      # loop has been exhausted on this one (see this file's and
      # entrypoint.sh's git history for the 7 attempts that got this far).
      CUPS_SERVER: cups
      FOCUSINK_CUPS_QUEUE: PDF
      FOCUSINK_LP_BINARY: lp
    depends_on:
      cups:
        condition: service_healthy
    volumes:
      - cups-output:/output:ro
      - ./tests/docker:/app/tests_docker:ro

  relay:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile

volumes:
  cups-output:
