; TimeBoard: a color-coded-timeline / icon-based-scheduling / Pomodoro
; visual time-planning device for ADHD/time-blindness support, inspired
; by github.com/jsoeterbroek/pictostick (same hardware family — ESP32 +
; small color display — but a from-scratch app; see README.md for what's
; borrowed vs. new). Separate device/firmware from the main X4-Printer
; project this lives alongside.
;
; Board id/lib_deps verified against
; github.com/renehagen/M5StickC-PLUS2-platformio-example (no M5StickC
; Plus2 hardware available in this development environment to build-and-
; flash-verify directly — see README.md "Known limitations").
;
; Build:  pio run
; Flash:  pio run -t upload
; Host tests (pure-logic modules only, no board needed):
;   see test/CMakeLists.txt — `cd test && cmake -B build && cmake --build build && ctest --test-dir build`

[env:m5stickc_plus2]
platform = espressif32
board = m5stickc_plus2
framework = arduino
monitor_speed = 115200

build_flags =
  -std=gnu++17

lib_deps =
  m5stack/M5Unified @ ^0.2.0
  m5stack/M5GFX @ ^0.2.0
  m5stack/M5StickCPlus2 @ ^1.0.0
  bblanchon/ArduinoJson @ 7.4.2
