; Xteink X4 Print Inbox firmware.
;
; Modeled directly on freeink-sdk/platformio.sample.ini's [env:xteink_x4]
; (tightest single-device C3 build: links only the SSD1677 driver) — see
; docs/architecture.md for what else is reused from the reference projects.
;
; Build:  pio run -e xteink_x4
; Flash:  pio run -e xteink_x4 -t upload
; Host tests (pure-logic modules only, no Arduino toolchain needed):
;   see test/CMakeLists.txt — `cd test && cmake -B build && cmake --build build && ctest --test-dir build`

[platformio]
default_envs = xteink_x4

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x) —
; same platform pin as freeink-sdk/platformio.sample.ini and
; crosspoint-reader/platformio.ini, so this builds against the exact
; toolchain FreeInk itself is verified against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
; This board has no OTA update path (firmware is flashed over USB; the
; sync protocol carries print jobs/approvals only, see docs/protocol.md) --
; the default dual-OTA-slot partition table only gives ~1.25MB per app
; slot and the image has grown past that. A single no-OTA app partition
; gives much more headroom without wasting flash on an unused spiffs
; region or a second app slot this firmware never uses.
board_build.partitions = max_app_4MB.csv

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the SSD1677 controller's own RAM holds the
  ; previous frame. Matches freeink-sdk's sample and crosspoint-reader's
  ; default build (see platformio.sample.ini comment on the flag).
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  ; UTF-8 long filenames on the SD card (job titles from IPP job-name /
  ; document-name attributes are user text, not guaranteed ASCII).
  -DUSE_UTF8_LONG_NAMES=1
  -DFREEINK_DEVICE_X4=1
  -DXTEINK_APP_LOG_LEVEL=2

build_unflags =
  -std=gnu++11

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  bblanchon/ArduinoJson @ 7.4.2

[env:xteink_x4]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2

[env:xteink_x4_release]
extends = base
build_flags =
  ${base.build_flags}
  -DLOG_LEVEL=1
