body{font-family:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";max-width:480px;margin:1rem auto;padding:0 1rem;background:var(--bg);color:var(--fg)}

</style></head><body>
<header>
  <div class="header-row">
    <h1>Print Inbox</h1>
    <span id="signal" class="signal" style="display:none"></span>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">Auto</button>
  </div>
</header>
<p id="status" aria-live="polite" aria-atomic="true">Loading...</p>
<p id="sync-banner" style="display:none"></p>
<div id="activity-link" style="display:none"><a id="activity-link-a" href="#" target="_blank" rel="noopener">Recent activity</a><ul id="activity-list"></ul></div>
<details id="diag">
  <summary>Device info</summary>
  <div id="diag-body"></div>
</details>
<div id="jobs"></div>
<script>
// ---------------- Theme toggle (client-only; no device-side storage) ----------------
function currentThemePref() {
  try { return localStorage.getItem('x4-theme') || 'system'; } catch (e) { return 'system'; }
}
function applyTheme(pref) {
  if (pref === 'light' || pref === 'dark') {
    document.documentElement.setAttribute('data-theme', pref);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  document.getElementById('theme-toggle').textContent = pref === 'light' ? 'Light' : pref === 'dark' ? 'Dark' : 'Auto';
}
document.getElementById('theme-toggle').onclick = function () {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(currentThemePref()) + 1) % order.length];
  try {
    if (next === 'system') localStorage.removeItem('x4-theme');
    else localStorage.setItem('x4-theme', next);
  } catch (e) {}
  applyTheme(next);
};
applyTheme(currentThemePref());

// ---------------- Status / connectivity / sync ----------------

// Set only in station mode, and only when this device was paired against a
// Pi with the admin console enabled (see docs/architecture.md "On-device
// Web UI full-document preview") — lets refreshJobs() link straight to the
// Pi for the untouched original document, fetched by the browser directly
// (never proxied through or stored on the X4).
let piAdminBaseUrl = null;

let deviceId = null;

async function refreshStatus() {
  const r = await fetch('/api/status');
  if (!r.ok) return;
  const s = await r.json();
  document.getElementById('status').textContent =
    s.device_name + ' - ' + s.unread_count + ' unread of ' + s.job_count;
  piAdminBaseUrl = s.pi_admin_base_url || null;
  deviceId = s.device_id || null;
  renderConnectivity(s);
  renderSyncBanner(s);
  renderActivityLink();
}

// Station mode + admin console only, same gating as the per-job "View full
// document" link. Unlike that link (and the thumbnails), this one now also
// fetch()es its own URL with credentials: "include" and renders the result
// inline — admin_api.py's devices/{id}/approvals route replies with
// reflected-origin CORS + Allow-Credentials specifically for this, so the
// browser attaches its cached Basic-auth credentials cross-origin (see
// docs/architecture.md's note on this route and docs/security.md "Admin web
// console"). The <a> stays as a "view all"/fallback link regardless of
// whether the inline fetch succeeds.
let activityLoaded = false;

function renderActivityLink() {
  const el = document.getElementById('activity-link');
  if (!piAdminBaseUrl || !deviceId) { el.style.display = 'none'; return; }
  const url = piAdminBaseUrl + '/api/admin/v1/devices/' + encodeURIComponent(deviceId) + '/approvals';
  document.getElementById('activity-link-a').href = url;
  el.style.display = 'block';
  // Fetched once, not on every status poll — this is history, not live data.
  if (!activityLoaded) {
    activityLoaded = true;
    loadActivityList(url);
  }
}

function formatActivityItem(a) {
  const label = a.job_title || a.job_id;
  const when = new Date(a.received_at * 1000).toLocaleString();
  return label + ' – ' + a.action + ' (' + when + ')';
}

// Fails soft on any error (network, non-2xx, or a CORS failure) — same
// "worst case is nothing shown" philosophy as the thumbnail <img>'s
// onerror above: leave the list empty rather than throwing, and the "view
// all" <a> is still there as a fallback.
async function loadActivityList(url) {
  const list = document.getElementById('activity-list');
  try {
    const r = await fetch(url, { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    const approvals = data.approvals || [];
    list.innerHTML = '';
    for (const a of approvals) {
      const li = document.createElement('li');
      li.textContent = formatActivityItem(a);
      list.appendChild(li);
    }
  } catch (e) {
    // network error or CORS failure — leave the list as-is (empty).
  }
}

function renderConnectivity(s) {
  const el = document.getElementById('signal');
  if (s.wifi_rssi === undefined) { el.style.display = 'none'; return; }
  const rssi = s.wifi_rssi;
  let tier, label;
  if (rssi >= -60) { tier = 'strong'; label = 'Strong Wi-Fi signal'; }
  else if (rssi >= -75) { tier = 'ok'; label = 'OK Wi-Fi signal'; }
  else { tier = 'weak'; label = 'Weak Wi-Fi signal'; }
  el.style.display = 'inline-flex';
  el.className = 'signal signal-' + tier;
  el.textContent = rssi + ' dBm';
  el.setAttribute('aria-label', label + ', ' + rssi + ' dBm');
}

function renderSyncBanner(s) {
  const el = document.getElementById('sync-banner');
  const n = s.outbox_pending || 0;
  if (n > 0) {
    el.textContent = n + (n === 1 ? ' action' : ' actions') + ' waiting to sync';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

// ---------------- Device diagnostics (lazy-fetched once, on expand) ----------------

function fmtGB(bytes) {
  return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
}

function fmtKB(bytes) {
  return (bytes / 1024).toFixed(0) + ' KB';
}

let diagLoaded = false;
document.getElementById('diag').addEventListener('toggle', async function (e) {
  if (!e.target.open || diagLoaded) return;
  diagLoaded = true;
  const body = document.getElementById('diag-body');
  const r = await fetch('/api/diag');
  if (!r.ok) { body.textContent = 'Unavailable.'; return; }
  const d = await r.json();
  body.innerHTML = '';
  const rows = [
    ['Name', d.device_name],
    ['ID', d.device_id],
    ['Panel', d.panel_width + '×' + d.panel_height],
    ['Uptime', Math.floor(d.uptime_seconds / 60) + ' min'],
  ];
  if (d.sd_total_bytes) {
    rows.push(['Storage', fmtGB(d.sd_free_bytes) + ' free of ' + fmtGB(d.sd_total_bytes)]);
  }
  if (d.battery_percent != null) {
    rows.push(['Battery', d.battery_percent + '%']);
  }
  if (d.heap_free_bytes != null) {
    rows.push(['Free memory', fmtKB(d.heap_free_bytes)]);
  }
  for (const pair of rows) {
    const p = document.createElement('p');
    p.textContent = pair[0] + ': ' + pair[1];
    body.appendChild(p);
  }
});

// ---------------- Job list rendering (diff/patch — see renderJobs()) ----------------

function formatMeta(j) {
  const sizeKb = (j.xtc_bytes / 1024).toFixed(0) + ' KB';
  const date = new Date(j.created_at * 1000).toLocaleString();
  const sha = (j.xtc_sha256 || '').slice(0, 8);
  return j.status + ' · ' + sizeKb + ' · ' + date + (sha ? ' · ' + sha : '');
}

function updateCardText(div, j) {
  div._refs.h3.textContent = j.title + ' (' + j.page_count + ' pg)';
  div._refs.meta.textContent = formatMeta(j);
}

// Rebuilds the interactive part of a card (actions/preview/nav/doc-link) —
// only called on first build, or when pending_approval flips, or when
// xtc_sha256 changes (a re-synced job) — never on every poll, so an open
// preview/page-nav state survives normal 20s refreshes untouched.
function rebuildBody(div, j) {
  const body = div._refs.body;
  body.innerHTML = '';
  div._preview = null;

  if (j.pending_approval) {
    const p = document.createElement('p');
    p.textContent = 'Action queued, syncing...';
    body.appendChild(p);
    return;
  }

  for (const pair of [['Print', 'print'], ['Keep', 'keep'], ['Delete', 'delete']]) {
    const b = document.createElement('button');
    b.textContent = pair[0];
    b.onclick = () => act(j.job_id, pair[1]);
    body.appendChild(b);
  }

  const previewBtn = document.createElement('button');
  previewBtn.textContent = 'Preview';

  const navWrap = document.createElement('span');
  navWrap.className = 'pagenav';
  navWrap.style.display = 'none';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '‹';
  prevBtn.setAttribute('aria-label', 'Previous page');
  const pageLabel = document.createElement('span');
  pageLabel.className = 'pagelabel';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '›';
  nextBtn.setAttribute('aria-label', 'Next page');
  navWrap.appendChild(prevBtn);
  navWrap.appendChild(pageLabel);
  navWrap.appendChild(nextBtn);

  const canvas = document.createElement('canvas');
  canvas.style.display = 'none';
  canvas.style.maxWidth = '100%';
  canvas.style.marginTop = '.5rem';
  canvas.style.border = '1px solid var(--border)';
  canvas.style.borderRadius = '10px';

  div._navRefs = { canvas, navWrap, prevBtn, nextBtn, pageLabel };
  previewBtn.onclick = () => openPreview(div, j);
  prevBtn.onclick = () => turnPage(div, -1);
  nextBtn.onclick = () => turnPage(div, 1);

  body.appendChild(previewBtn);
  body.appendChild(navWrap);
  body.appendChild(canvas);

  if (piAdminBaseUrl) {
    const docLink = document.createElement('a');
    docLink.textContent = 'View full document';
    docLink.href = piAdminBaseUrl + '/api/admin/v1/jobs/' + encodeURIComponent(j.job_id) + '/original';
    docLink.target = '_blank';
    docLink.rel = 'noopener';
    body.appendChild(docLink);
  }
}

function buildCard(j) {
  const div = document.createElement('div');
  div.className = 'job';
  div.dataset.jobId = j.job_id;
  div.dataset.pending = j.pending_approval ? '1' : '0';
  div.dataset.sha = j.xtc_sha256 || '';

  // Station mode only, and only if this device was paired against a Pi
  // with the admin console enabled (see docs/architecture.md "On-device
  // Web UI full-document preview"). Placed once here (not in rebuildBody,
  // which reruns on every pending/content change) since the thumbnail is
  // tied to the job's identity, not its approval state — no reason to
  // recreate/re-fetch it just because Print/Keep/Delete state changed.
  // Whether this actually renders depends on the phone browser having
  // already cached HTTP Basic Auth credentials for the Pi's origin (from
  // opening "View full document" at least once this session) — unverified
  // on real mobile browsers; onError below hides it cleanly either way,
  // so the worst case is simply no thumbnail shown, never a broken image
  // or an unexpected auth prompt (subresource loads don't trigger those).
  if (piAdminBaseUrl) {
    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.loading = 'lazy';
    thumb.alt = '';
    thumb.src = piAdminBaseUrl + '/api/admin/v1/jobs/' + encodeURIComponent(j.job_id) + '/thumbnail';
    thumb.onerror = () => thumb.remove();
    div.appendChild(thumb);
  }

  const h3 = document.createElement('h3');
  div.appendChild(h3);
  const meta = document.createElement('p');
  meta.className = 'meta';
  div.appendChild(meta);
  const body = document.createElement('div');
  div.appendChild(body);

  div._refs = { h3, meta, body };
  updateCardText(div, j);
  rebuildBody(div, j);
  return div;
}

function updateCard(div, j) {
  updateCardText(div, j);
  const wasPending = div.dataset.pending === '1';
  const isPending = !!j.pending_approval;
  const oldSha = div.dataset.sha || '';
  const newSha = j.xtc_sha256 || '';
  if (isPending !== wasPending || oldSha !== newSha) {
    rebuildBody(div, j);
  }
  div.dataset.pending = isPending ? '1' : '0';
  div.dataset.sha = newSha;
}

const cardElements = new Map(); // job_id -> card <div>

function renderJobs(jobs) {
  const el = document.getElementById('jobs');
  const incomingIds = new Set(jobs.map(j => j.job_id));

  for (const [jobId, div] of cardElements) {
    if (!incomingIds.has(jobId)) {
      div.remove();
      cardElements.delete(jobId);
    }
  }

  const emptyMsg = el.querySelector('.empty');
  if (jobs.length === 0) {
    if (!emptyMsg) el.innerHTML = '<p class="empty">Inbox empty.</p>';
    return;
  }
  if (emptyMsg) emptyMsg.remove();

  let prevEl = null;
  for (const j of jobs) {
    let div = cardElements.get(j.job_id);
    if (!div) {
      div = buildCard(j);
      cardElements.set(j.job_id, div);
    } else {
      updateCard(div, j);
    }
    const wantedNext = prevEl ? prevEl.nextSibling : el.firstChild;
    if (wantedNext !== div) el.insertBefore(div, wantedNext);
    prevEl = div;
  }
}

async function refreshJobs() {
  const r = await fetch('/api/jobs');
  if (!r.ok) return;
  const data = await r.json();
  renderJobs(data.jobs);
}

async function act(jobId, action) {
  await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({job_id: jobId, action: action})});
  refreshJobs();
}

// ---------------- Client-side XTC decode + preview (tools/xtc-wasm/) ----------------
// Entirely offline once xtc-decoder.js/.wasm are fetched from this device —
// no CDN, no external libraries, matches the hotspot mode's no-internet-
// access constraint.

let xtcModulePromise = null;
function loadXtcModule() {
  if (!xtcModulePromise) {
    xtcModulePromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '/xtc-decoder.js';
      script.onload = () => {
        createXtcDecoderModule({locateFile: () => '/xtc-decoder.wasm'}).then(resolve, reject);
      };
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }
  return xtcModulePromise;
}

// Raw XTC bytes, keyed by job_id+sha256, and decoded pages, keyed by
// job_id+sha256+page — both capped with simple insertion-order eviction so
// a long browsing session can't grow either cache unbounded. Keying on the
// checksum (not job_id alone) means a re-synced job with different content
// can never serve a stale cached preview: it just leaves the old entries
// as harmless, eventually-evicted dead keys under a new key.
const rawBytesCache = new Map();
const decodedCache = new Map();
const MAX_RAW_CACHE = 16;
const MAX_DECODED_CACHE = 32;

function cacheSet(map, key, value, max) {
  map.set(key, value);
  if (map.size > max) map.delete(map.keys().next().value);
}

async function fetchRawBytes(jobId, sha) {
  const key = jobId + ':' + sha;
  const cached = rawBytesCache.get(key);
  if (cached) return cached;
  const r = await fetch('/api/jobs/xtc?job_id=' + encodeURIComponent(jobId));
  if (!r.ok) throw new Error('fetch failed');
  const bytes = new Uint8Array(await r.arrayBuffer());
  cacheSet(rawBytesCache, key, bytes, MAX_RAW_CACHE);
  return bytes;
}

function paintGray(canvas, gray, width, height) {
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(width, height);
  for (let i = 0; i < width * height; i++) {
    const v = gray[i];
    imgData.data[i * 4] = v;
    imgData.data[i * 4 + 1] = v;
    imgData.data[i * 4 + 2] = v;
    imgData.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
}

function showPreviewError(canvas) {
  canvas.width = 200;
  canvas.height = 40;
  const ctx = canvas.getContext('2d');
  ctx.font = '14px sans-serif';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillText('Preview unavailable.', 4, 20);
}

function updateNav(state, refs, pageIndex) {
  state.currentPage = pageIndex;
  refs.pageLabel.textContent = 'Page ' + (pageIndex + 1) + ' / ' + state.pageCount;
  refs.prevBtn.disabled = pageIndex === 0;
  refs.nextBtn.disabled = pageIndex === state.pageCount - 1;
}

function turnPage(div, delta) {
  const state = div._preview;
  if (!state) return;
  const target = state.currentPage + delta;
  decodeAndRenderPage(div, target);
}

async function decodeAndRenderPage(div, pageIndex) {
  const state = div._preview;
  const refs = div._navRefs;
  if (!state || pageIndex < 0 || pageIndex >= state.pageCount) return;

  const decodedKey = div.dataset.jobId + ':' + state.sha + ':' + pageIndex;
  const cachedPage = decodedCache.get(decodedKey);
  if (cachedPage) {
    paintGray(refs.canvas, cachedPage.gray, cachedPage.width, cachedPage.height);
    updateNav(state, refs, pageIndex);
    return;
  }

  const mod = state.mod;
  let inPtr = 0, widthPtr = 0, heightPtr = 0, outPtr = 0;
  try {
    inPtr = mod._malloc(state.bytes.length);
    widthPtr = mod._malloc(2);
    heightPtr = mod._malloc(2);
    if (!inPtr || !widthPtr || !heightPtr) throw new Error('out of memory');
    mod.HEAPU8.set(state.bytes, inPtr);
    outPtr = mod._xtc_decode_page(inPtr, state.bytes.length, pageIndex, widthPtr, heightPtr);
    if (outPtr === 0) throw new Error('decode failed');
    const width = mod.HEAPU16[widthPtr >> 1];
    const height = mod.HEAPU16[heightPtr >> 1];
    // Copy out of WASM memory before painting/caching — HEAPU8.subarray()
    // is a *view*, not a copy; caching that view (or reading it after
    // xtc_free()/a memory-growth reallocation) would risk reading freed or
    // detached WASM memory the next time this page is opened from cache.
    const gray = new Uint8Array(mod.HEAPU8.subarray(outPtr, outPtr + width * height));
    cacheSet(decodedCache, decodedKey, {width, height, gray}, MAX_DECODED_CACHE);
    paintGray(refs.canvas, gray, width, height);
    updateNav(state, refs, pageIndex);
  } catch (e) {
    showPreviewError(refs.canvas);
  } finally {
    if (inPtr) mod._free(inPtr);
    if (widthPtr) mod._free(widthPtr);
    if (heightPtr) mod._free(heightPtr);
    if (outPtr) mod._xtc_free(outPtr);
  }
}

async function openPreview(div, j) {
  const refs = div._navRefs;
  const canvas = refs.canvas;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = 200;
  canvas.height = 40;
  ctx.font = '14px sans-serif';
  ctx.fillText('Loading preview...', 4, 20);

  const sha = j.xtc_sha256;
  let mod = null, inPtr = 0, widthPtr = 0, heightPtr = 0, outPtr = 0;
  try {
    // Independent I/O — overlap the module load with the file fetch
    // instead of paying both latencies back-to-back.
    const [loadedMod, bytes] = await Promise.all([loadXtcModule(), fetchRawBytes(j.job_id, sha)]);
    mod = loadedMod;

    inPtr = mod._malloc(bytes.length);
    widthPtr = mod._malloc(2);
    heightPtr = mod._malloc(2);
    if (!inPtr || !widthPtr || !heightPtr) throw new Error('out of memory');
    mod.HEAPU8.set(bytes, inPtr);

    const pageCount = mod._xtc_page_count(inPtr, bytes.length) || 1;
    outPtr = mod._xtc_decode_page(inPtr, bytes.length, 0, widthPtr, heightPtr);
    if (outPtr === 0) throw new Error('decode failed');
    const width = mod.HEAPU16[widthPtr >> 1];
    const height = mod.HEAPU16[heightPtr >> 1];
    const gray = new Uint8Array(mod.HEAPU8.subarray(outPtr, outPtr + width * height));
    cacheSet(decodedCache, div.dataset.jobId + ':' + sha + ':0', {width, height, gray}, MAX_DECODED_CACHE);
    paintGray(canvas, gray, width, height);

    div._preview = {mod, bytes, sha, pageCount, currentPage: 0};
    if (pageCount > 1) {
      refs.navWrap.style.display = 'inline-flex';
      updateNav(div._preview, refs, 0);
    }
  } catch (e) {
    showPreviewError(canvas);
  } finally {
    if (inPtr) mod._free(inPtr);
    if (widthPtr) mod._free(widthPtr);
    if (heightPtr) mod._free(heightPtr);
    if (outPtr) mod._xtc_free(outPtr);
  }
}

// refreshJobs() reads piAdminBaseUrl, which only refreshStatus() sets —
// sequenced (not fired concurrently) so the "View full document" link
// can't be silently omitted by refreshJobs() winning the race on a slow
// /api/status response.
async function refreshAll() { await refreshStatus(); await refreshJobs(); }
refreshAll();
setInterval(refreshAll, 20000);
</script></body></html>
